version: 1
layout: repo
lastReviewedAt: 2026-08-22
lastReviewedCommit: fe6687b78bae4241b59c82280f4a97b2fcff05d3
catalog:
  repos:
    - id: wiser
      path: .
      canonicalRepo: linancn/wiser
      entryDoc: AGENTS.md
      branchPolicyDoc: CONTRIBUTING.md
      workflowDocs:
        - README.md
        - README.en.md
        - apps/docs/src/content/docs/zh-CN/quick-start.md
        - apps/docs/src/content/docs/en/quick-start.md
      integrationDocs:
        - docs/design/v2-multi-scenario-multi-agent-observability.md
      workspaceIntegrationRequired: false
ownership:
  domains:
    - id: domain-model
      paths:
        include:
          - packages/contracts/**
          - packages/core/**
      ownerRepo: wiser
    - id: platform-foundations
      paths:
        include:
          - packages/platform-*/**
          - apps/api/src/platform/**
          - apps/web/src/components/platform/**
      ownerRepo: wiser
    - id: data-foundation
      paths:
        include:
          - packages/data-*/**
          - apps/data-worker/**
          - apps/api/src/data-foundation/**
          - apps/mcp/src/data-foundation/**
          - apps/web/src/app/[locale]/data-foundation/**
          - infrastructure/data-foundation/**
      ownerRepo: wiser
    - id: runtime-adapters
      paths:
        include:
          - apps/api/**
          - apps/mcp/**
          - apps/worker/**
          - packages/infra/**
      ownerRepo: wiser
    - id: product-surfaces
      paths:
        include:
          - apps/web/**
          - apps/docs/**
      ownerRepo: wiser
    - id: persistence-and-observability
      paths:
        include:
          - apps/telemetry-ingress/**
          - infrastructure/**
          - supabase/**
      ownerRepo: wiser
    - id: scenarios-and-agent-workflows
      paths:
        include:
          - cookbooks/**
          - scenarios/**
      ownerRepo: wiser
coverage:
  include:
    - .docpact/config.yaml
    - .github/workflows/**
    - .env.example
    - compose.yaml
    - package.json
    - pnpm-workspace.yaml
    - tsconfig.json
    - tsconfig.base.json
    - apps/api/src/**
    - apps/mcp/src/**
    - apps/worker/src/**
    - apps/telemetry-ingress/src/**
    - apps/web/src/**
    - apps/docs/src/app/**
    - apps/docs/src/components/**
    - apps/docs/src/lib/**
    - apps/docs/src/mdx-components.tsx
    - apps/docs/source.config.ts
    - apps/docs/next.config.ts
    - apps/api/src/platform/**
    - apps/api/src/data-foundation/**
    - apps/mcp/src/data-foundation/**
    - apps/data-worker/src/**
    - apps/web/src/components/platform/**
    - apps/web/src/app/[locale]/data-foundation/**
    - packages/contracts/src/**
    - packages/core/src/**
    - packages/infra/src/**
    - packages/platform-*/src/**
    - packages/data-*/src/**
    - infrastructure/docker/**
    - infrastructure/observability/*.yaml
    - infrastructure/observability/smoke.mjs
    - infrastructure/data-foundation/**
    - supabase/config.toml
    - supabase/migrations/**
    - supabase/schemas/**
    - supabase/seed.sql
    - scenarios/**/facts/**
    - scenarios/**/fixture/**
    - scenarios/**/manifest.json
    - scenarios/**/provenance/**
    - scenarios/**/v2/**
    - cookbooks/workbuddy-yongding-tdd/cookbook.yaml
    - cookbooks/workbuddy-yongding-tdd/failure-injection.md
    - cookbooks/workbuddy-yongding-tdd/roles/**
    - cookbooks/workbuddy-yongding-tdd/schemas/**
    - cookbooks/workbuddy-yongding-tdd/scripts/**
    - cookbooks/workbuddy-yongding-tdd/showcase/schemas/**
    - cookbooks/workbuddy-yongding-tdd/showcase/scripts/**
    - cookbooks/workbuddy-yongding-tdd/showcase/showcase.yaml
freshness:
  warn_after_commits: 50
  warn_after_days: 90
  critical_after_days: 180
routing:
  intents:
    governance:
      paths:
        - .docpact/**
        - .github/workflows/**
        - AGENTS.md
        - CONTRIBUTING.md
    domain-model:
      paths:
        - packages/contracts/**
        - packages/core/**
        - docs/design/**
    participant-protocol:
      paths:
        - apps/api/**
        - apps/mcp/**
        - apps/docs/src/content/docs/*/protocols/**
    persistence-security:
      paths:
        - supabase/**
        - apps/docs/src/content/docs/*/architecture/security.md
    observability:
      paths:
        - apps/telemetry-ingress/**
        - infrastructure/observability/**
        - apps/web/**
        - apps/docs/src/content/docs/*/architecture/multi-agent-observability.md
    platform-foundations:
      paths:
        - packages/platform-*/**
        - apps/api/src/platform/**
        - apps/web/src/components/platform/**
        - apps/docs/src/content/docs/*/architecture/wiser-platform.md
        - apps/docs/src/content/docs/*/architecture/unified-auth.md
        - apps/docs/src/content/docs/*/architecture/design-system.md
    data-foundation:
      paths:
        - packages/data-*/**
        - apps/data-worker/**
        - apps/api/src/data-foundation/**
        - apps/mcp/src/data-foundation/**
        - apps/web/src/app/*/data-foundation/**
        - infrastructure/data-foundation/**
    scenario-workflows:
      paths:
        - scenarios/**
        - cookbooks/**
        - apps/docs/src/content/docs/*/scenarios/**
docInventory:
