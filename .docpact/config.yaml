repo:
  id: wiser
  owner: wiser
  runtime: node
rules:
  - id: governance-workflow
    scope: repo
    repo: wiser
    triggers:
      - path: .docpact/config.yaml
        kind: governance
      - path: .github/workflows/**
        kind: automation
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: CONTRIBUTING.md
        mode: review_or_update
    reason: Governance and CI changes must keep agent and contributor instructions current.
  - id: developer-toolchain
    scope: repo
    repo: wiser
    triggers:
      - path: package.json
        kind: automation
      - path: pnpm-workspace.yaml
        kind: automation
      - path: tsconfig*.json
        kind: automation
    requiredDocs:
      - path: apps/docs/src/content/docs/zh-CN/quick-start.md
        mode: review_or_update
      - path: apps/docs/src/content/docs/en/quick-start.md
        mode: review_or_update
    reason: Toolchain changes must keep the bilingual installation and verification workflow accurate.
  - id: wiser-platform-contracts
    scope: repo
    repo: wiser
    triggers:
      - path: packages/platform-*/src/**
        kind: code
      - path: apps/api/src/platform/**
        kind: code
    requiredDocs:
      - path: apps/docs/src/content/docs/zh-CN/architecture/wiser-platform.md
        mode: review_or_update
      - path: apps/docs/src/content/docs/en/architecture/wiser-platform.md
        mode: review_or_update
    reason: Shared composition and platform contract changes must preserve the bilingual multi-system boundary.
  - id: wiser-platform-auth
    scope: repo
    repo: wiser
    triggers:
      - path: packages/platform-auth/src/**
        kind: code
      - path: apps/api/src/auth.ts
        kind: code
      - path: apps/api/src/runtime-auth.ts
        kind: code
      - path: apps/api/src/platform/auth-runtime.ts
        kind: code
      - path: apps/api/src/platform/identity-module.ts
        kind: code
      - path: apps/api/src/platform/delegation-module.ts
        kind: code
      - path: apps/web/src/lib/supabase/**
        kind: code
      - path: apps/web/src/lib/auth.ts
        kind: code
      - path: apps/web/src/app/*/auth/**
        kind: code
      - path: apps/web/src/app/*/login/**
        kind: code
      - path: apps/web/src/components/current-user-control.tsx
        kind: code
      - path: apps/web/src/proxy.ts
        kind: code
      - path: supabase/schemas/02_platform_auth.sql
        kind: database
      - path: supabase/migrations/*platform_auth*.sql
        kind: database
    requiredDocs:
      - path: apps/docs/src/content/docs/zh-CN/architecture/wiser-platform.md
        mode: review_or_update
      - path: apps/docs/src/content/docs/en/architecture/wiser-platform.md
        mode: review_or_update
      - path: apps/docs/src/content/docs/zh-CN/architecture/unified-auth.md
        mode: review_or_update
      - path: apps/docs/src/content/docs/en/architecture/unified-auth.md
        mode: review_or_update
    reason: Authentication and authorization changes must preserve the single Supabase identity boundary in both locales.
  - id: data-foundation-contracts
    scope: repo
    repo: wiser
    triggers:
      - path: packages/data-contracts/src/**
        kind: code
    requiredDocs:
      - path: apps/docs/src/content/docs/zh-CN/architecture/data-foundation.md
        mode: review_or_update
      - path: apps/docs/src/content/docs/en/architecture/data-foundation.md
        mode: review_or_update
      - path: apps/docs/src/content/docs/zh-CN/protocols/data-rest.md
        mode: review_or_update
      - path: apps/docs/src/content/docs/en/protocols/data-rest.md
        mode: review_or_update
      - path: apps/docs/src/content/docs/zh-CN/protocols/data-graphql.md
        mode: review_or_update
      - path: apps/docs/src/content/docs/en/protocols/data-graphql.md
        mode: review_or_update
      - path: apps/docs/src/content/docs/zh-CN/protocols/data-mcp.md
        mode: review_or_update
      - path: apps/docs/src/content/docs/en/protocols/data-mcp.md
        mode: review_or_update
    reason: Data Foundation public DTO and Capability changes must preserve one bilingual transport-neutral contract.
  - id: data-foundation-core
    scope: repo
    repo: wiser
    triggers:
      - path: packages/data-core/src/**
        kind: code
    requiredDocs:
      - path: apps/docs/src/content/docs/zh-CN/architecture/data-foundation.md
        mode: review_or_update
      - path: apps/docs/src/content/docs/en/architecture/data-foundation.md
        mode: review_or_update
    reason: Deterministic ingestion, quality, security, publication, and Operation rules must stay aligned in both locales.
  - id: data-foundation-infra
    scope: repo
    repo: wiser
    triggers:
      - path: packages/data-infra/src/**
        kind: code
      - path: infrastructure/data-foundation/**
        kind: database
    requiredDocs:
      - path: apps/docs/src/content/docs/zh-CN/architecture/data-foundation.md
        mode: review_or_update
      - path: apps/docs/src/content/docs/en/architecture/data-foundation.md
        mode: review_or_update
    reason: Authoritative data-postgres, migration, object-store, projection, GIS, search, and AI adapters must stay aligned in both locales.
  - id: data-foundation-worker
    scope: repo
    repo: wiser
    triggers:
      - path: apps/data-worker/src/**
        kind: code
    requiredDocs:
      - path: apps/docs/src/content/docs/zh-CN/architecture/data-foundation.md
        mode: review_or_update
      - path: apps/docs/src/content/docs/en/architecture/data-foundation.md
        mode: review_or_update
    reason: Durable scheduling, job handling, health, and worker lifecycle changes must stay aligned in both locales.
  - id: data-foundation-api
    scope: repo
    repo: wiser
    triggers:
      - path: apps/api/src/data-foundation/**
        kind: code
    requiredDocs:
      - path: apps/docs/src/content/docs/zh-CN/architecture/data-foundation.md
        mode: review_or_update
      - path: apps/docs/src/content/docs/en/architecture/data-foundation.md
        mode: review_or_update
      - path: apps/docs/src/content/docs/zh-CN/protocols/data-rest.md
        mode: review_or_update
      - path: apps/docs/src/content/docs/en/protocols/data-rest.md
        mode: review_or_update
      - path: apps/docs/src/content/docs/zh-CN/protocols/data-graphql.md
        mode: review_or_update
      - path: apps/docs/src/content/docs/en/protocols/data-graphql.md
        mode: review_or_update
    reason: Data Foundation HTTP composition and Capability transport changes must stay aligned in both locales.
  - id: data-foundation-mcp
    scope: repo
    repo: wiser
    triggers:
      - path: apps/mcp/src/data-foundation/**
        kind: code
    requiredDocs:
      - path: apps/docs/src/content/docs/zh-CN/architecture/data-foundation.md
        mode: review_or_update
      - path: apps/docs/src/content/docs/en/architecture/data-foundation.md
        mode: review_or_update
      - path: apps/docs/src/content/docs/zh-CN/protocols/data-mcp.md
        mode: review_or_update
      - path: apps/docs/src/content/docs/en/protocols/data-mcp.md
        mode: review_or_update
    reason: Data MCP Tools, Resources, transport mapping, and response boundaries require their own bilingual protocol review.
  - id: data-foundation-web
    scope: repo
    repo: wiser
    triggers:
      - path: apps/web/src/app/*/data-foundation/**
        kind: code
      - path: apps/web/src/components/data-foundation-*
        kind: code
      - path: apps/web/src/lib/data-foundation*
        kind: code
    requiredDocs:
      - path: apps/docs/src/content/docs/zh-CN/architecture/data-foundation.md
        mode: review_or_update
      - path: apps/docs/src/content/docs/en/architecture/data-foundation.md
        mode: review_or_update
      - path: apps/docs/src/content/docs/zh-CN/architecture/design-system.md
        mode: review_or_update
      - path: apps/docs/src/content/docs/en/architecture/design-system.md
        mode: review_or_update
    reason: Data Foundation Web changes must preserve the delivered authority states and shared bilingual light/dark design contract.
  - id: wiser-design-system
    scope: repo
    repo: wiser
    triggers:
      - path: apps/web/src/app/globals.css
        kind: code
      - path: apps/web/src/components/app-shell.tsx
        kind: code
      - path: apps/web/src/components/app-shell.module.css
        kind: code
      - path: apps/web/src/components/theme-toggle.tsx
        kind: code
      - path: apps/web/src/components/platform/**
        kind: code
    requiredDocs:
      - path: apps/docs/src/content/docs/zh-CN/architecture/design-system.md
        mode: review_or_update
      - path: apps/docs/src/content/docs/en/architecture/design-system.md
        mode: review_or_update
    reason: Shared UI token and platform component changes must preserve the bilingual light/dark WISER Design System.
  - id: local-stack-workflow
    scope: repo
    repo: wiser
    triggers:
      - path: compose.yaml
        kind: automation
      - path: .env.example
        kind: configuration
      - path: infrastructure/docker/**
        kind: automation
    requiredDocs:
      - path: README.md
        mode: review_or_update
      - path: README.en.md
        mode: review_or_update
      - path: apps/docs/src/content/docs/zh-CN/quick-start.md
        mode: review_or_update
      - path: apps/docs/src/content/docs/en/quick-start.md
        mode: review_or_update
    reason: Local stack changes must keep both repository and detailed startup paths accurate.
  - id: domain-contracts
    scope: repo
