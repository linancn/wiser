name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docpact:
    name: Verify documentation governance
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate Docpact configuration
        uses: Biaoo/docpact@d07ba8c500c6a10d90edfd7fb062018d2d3cbf96 # v0.1.9
        with:
          version: 0.1.9
          args: validate-config --root . --strict

      - name: Enforce pull-request documentation obligations
        if: github.event_name == 'pull_request'
        run: >-
          docpact lint
          --root .
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --mode enforce
          --fail-on-uncovered-change
          --fail-on-stale-docs

      - name: Audit default-branch governance coverage
        if: github.event_name == 'push'
        run: docpact coverage --root . --format text

  verify:
    name: Verify workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

  database:
    name: Verify Supabase schema
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: verify

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm supabase:start

      - name: Verify migrations, pgTAP, lint, and advisors
        run: pnpm supabase:verify

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop || true

  data-foundation:
    name: Verify Data Foundation vertical slice
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: verify

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start and seed unified Supabase Auth
        run: pnpm supabase:start && pnpm supabase:reset

      - name: Start pinned Data Foundation profile
        run: docker compose --profile data-foundation up -d --build --wait

      - name: Apply checksum-verified authority migrations
        run: pnpm data:migrate

      - name: Seed deterministic authority fixtures
        run: pnpm data:seed

      - name: Run the complete Data Foundation vertical slice
        run: pnpm data:smoke

      - name: Print Data Foundation logs on failure
        if: failure()
        run: docker compose --profile data-foundation logs --no-color --tail=300 data-postgres data-worker weaviate opensearch neo4j geoserver stac-api titiler martin tika clamav api mcp-http

      - name: Stop Data Foundation profile
        if: always()
        run: docker compose --profile data-foundation down --volumes --remove-orphans || true

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop || true

  observability:
    name: Verify local observability profile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: verify

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Start pinned observability profile
        run: docker compose --profile observability up -d --build otel-collector telemetry-ingress tempo prometheus loki grafana

      - name: Verify OTLP traces, metrics, logs, and redaction
        run: node infrastructure/observability/smoke.mjs

      - name: Print observability logs on failure
        if: failure()
        run: docker compose --profile observability logs --no-color --tail=300 telemetry-ingress otel-collector tempo prometheus loki grafana

      - name: Stop observability profile
        if: always()
        run: docker compose --profile observability down --volumes --remove-orphans || true
