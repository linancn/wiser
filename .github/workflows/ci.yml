name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docpact:
    name: Verify documentation governance
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate Docpact configuration
        uses: Biaoo/docpact@d07ba8c500c6a10d90edfd7fb062018d2d3cbf96 # v0.1.9
        with:
          version: 0.1.9
          args: validate-config --root . --strict

      - name: Enforce pull-request documentation obligations
        if: github.event_name == 'pull_request'
        run: >-
          docpact lint
          --root .
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --mode enforce
          --fail-on-uncovered-change
          --fail-on-stale-docs

      - name: Audit default-branch governance coverage
        if: github.event_name == 'push'
        run: docpact coverage --root . --format text

  verify:
    name: Verify workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      - name: Verify unit coverage ratchet
        run: pnpm test:coverage

      - name: Upload unit coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-coverage-${{ github.run_attempt }}
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 7

  browser:
    name: Verify reference browser flows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: verify

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and operating-system dependencies
        run: pnpm --filter @wiser/web exec playwright install --with-deps chromium

      - name: Verify Web and Docs reference flows
        run: pnpm test:e2e:reference

      - name: Upload failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reference-browser-failure-${{ github.run_attempt }}
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
            apps/docs/test-results/
            apps/docs/playwright-report/
          if-no-files-found: warn
          retention-days: 7

  database:
    name: Verify Supabase schema
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: verify

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm supabase:start

      - name: Verify migrations, pgTAP, lint, and advisors
        run: pnpm supabase:verify

      - name: Verify durable Agent EXCON journal against real PostgreSQL
        env:
          EXCON_JOURNAL_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:56322/postgres
        run: pnpm test:postgres:excon-v2

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop || true

  data-foundation:
    name: Verify Data Foundation vertical slice
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: verify

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for authenticated Data browser checks
        run: pnpm --filter @wiser/web exec playwright install --with-deps chromium

      - name: Generate isolated Data PostgreSQL credentials
        shell: bash
        run: |
          data_owner_password="ci-$(openssl rand -hex 24)"
          data_api_password="ci-$(openssl rand -hex 24)"
          data_worker_password="ci-$(openssl rand -hex 24)"
          data_gis_password="ci-$(openssl rand -hex 24)"

          for data_password in \
            "$data_owner_password" \
            "$data_api_password" \
            "$data_worker_password" \
            "$data_gis_password"
          do
            printf '::add-mask::%s\n' "$data_password"
          done

          {
            printf 'DATA_POSTGRES_PASSWORD=%s\n' "$data_owner_password"
            printf 'DATA_API_DATABASE_PASSWORD=%s\n' "$data_api_password"
            printf 'DATA_WORKER_DATABASE_PASSWORD=%s\n' "$data_worker_password"
            printf 'DATA_GIS_DATABASE_PASSWORD=%s\n' "$data_gis_password"
            printf 'DATA_TEST_DATABASE_URL=postgresql://wiser_data:%s@127.0.0.1:55432/wiser_data\n' "$data_owner_password"
            printf 'DATA_WORKER_PG_SMOKE_URL=postgresql://wiser_data_worker:%s@127.0.0.1:55432/wiser_data\n' "$data_worker_password"
          } >> "$GITHUB_ENV"

      - name: Start and seed unified Supabase Auth
        run: pnpm supabase:start && pnpm supabase:reset

      - name: Start pinned Data Foundation profile
        run: pnpm data:up

      - name: Apply checksum-verified authority migrations
        run: pnpm data:migrate

      - name: Seed deterministic authority fixtures
        run: pnpm data:seed

      - name: Run the complete Data Foundation vertical slice
        run: pnpm --silent data:smoke > "$RUNNER_TEMP/wiser-data-smoke.json"

      - name: Verify authenticated Data browser flow
        id: authenticated_data_browser
        env:
          WISER_WEB_LIVE_BASE_URL: http://127.0.0.1:3000
          WISER_WEB_LIVE_SMOKE_REPORT: ${{ runner.temp }}/wiser-data-smoke.json
          WISER_WEB_LIVE_EMAIL: operator@agent-excon.test
          WISER_WEB_LIVE_PASSWORD: WiserLocalOperator-2026!
        run: pnpm test:e2e:data-live

      - name: Upload failed authenticated Data browser diagnostics
        if: failure() && steps.authenticated_data_browser.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: authenticated-data-browser-failure-${{ github.run_attempt }}
          path: |
            apps/web/test-results-live/
            apps/web/playwright-report-live/
          if-no-files-found: warn
          retention-days: 7

      - name: Verify Data API commands against real PostgreSQL
        env:
          WISER_DATA_PG_INTEGRATION: '1'
        run: pnpm test:postgres:data-api

      - name: Verify Data Worker commit against real PostgreSQL
        run: pnpm test:postgres:data-worker

      - name: Print Data Foundation logs on failure
        if: failure()
        run: docker compose --profile data-foundation logs --no-color --tail=300 data-postgres data-worker weaviate opensearch neo4j geoserver stac-api titiler martin tika clamav api mcp-http web

      - name: Stop Data Foundation profile
        if: always()
        run: docker compose --profile data-foundation down --volumes --remove-orphans || true

      - name: Remove transient Data browser state
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/wiser-data-smoke.json"
          rm -f "$GITHUB_WORKSPACE/.wiser/local/runtime-secrets.json"
          rmdir "$GITHUB_WORKSPACE/.wiser/local" 2>/dev/null || true
          rmdir "$GITHUB_WORKSPACE/.wiser" 2>/dev/null || true

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop || true

  observability:
    name: Verify local observability profile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: verify

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Build shared application image
        run: docker compose build api

      - name: Start pinned observability profile
        run: docker compose --profile observability up -d --build otel-collector telemetry-ingress tempo prometheus loki grafana

      - name: Verify OTLP traces, metrics, logs, and redaction
        run: node infrastructure/observability/smoke.mjs

      - name: Print observability logs on failure
        if: failure()
        run: docker compose --profile observability logs --no-color --tail=300 telemetry-ingress otel-collector tempo prometheus loki grafana

      - name: Stop observability profile
        if: always()
        run: docker compose --profile observability down --volumes --remove-orphans || true
