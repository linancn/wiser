name: wiser

x-app: &app
  image: agent-excon-dev:local
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  extra_hosts:
    - host.docker.internal:host-gateway
  networks:
    - excon

x-data-service: &data-service
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - data-foundation

x-data-resources: &data-resources
  limits:
    cpus: '2.0'
    memory: 2G
  reservations:
    cpus: '0.10'
    memory: 128M

x-data-logging: &data-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  api:
    <<: *app
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.dev
    command: pnpm --filter @wiser/api dev
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3001
      AI_PROVIDER: fake
      WISER_AUTH_MODE: ${WISER_AUTH_MODE:-off}
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:56321}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:56322/postgres}
      WISER_DELEGATED_CREDENTIAL_HMAC_KEYS: ${WISER_DELEGATED_CREDENTIAL_HMAC_KEYS:-}
      EXCON_V2_MODE: ${EXCON_V2_MODE:-memory}
      EXCON_JOURNAL_DATABASE_URL: ${EXCON_JOURNAL_DATABASE_URL:-}
      EXCON_LEASE_HMAC_KEYS: ${EXCON_LEASE_HMAC_KEYS:-}
      EXCON_TENANT_ID: ${EXCON_TENANT_ID:-b1000000-0000-4000-8000-000000000001}
      EXCON_PROJECT_ID: ${EXCON_PROJECT_ID:-b2000000-0000-4000-8000-000000000001}
      EXCON_PURPOSE: ${EXCON_PURPOSE:-excon-api}
      DATA_FOUNDATION_MODE: ${DATA_FOUNDATION_MODE:-off}
      DATA_DATABASE_URL: postgresql://wiser_data_api:${DATA_API_DATABASE_PASSWORD:-wiser-local-api-runtime-8ac431d9}@data-postgres:5432/wiser_data
      DATA_S3_ENDPOINT: http://seaweedfs:8333
      DATA_S3_PUBLIC_ENDPOINT: http://127.0.0.1:18333
      DATA_S3_REGION: ${DATA_S3_REGION:-us-east-1}
      DATA_S3_BUCKET: ${DATA_S3_BUCKET:-wiser-authority}
      DATA_S3_ACCESS_KEY_ID: ${DATA_S3_ACCESS_KEY_ID:-wiser-data-local-access}
      DATA_S3_SECRET_ACCESS_KEY: ${DATA_S3_SECRET_ACCESS_KEY:-wiser-local-s3-8c492a72f6d84e2e}
      DATA_WORKER_URL: http://data-worker:3003
      DATA_WEAVIATE_URL: http://weaviate:8080
      DATA_WEAVIATE_API_KEY: ${WEAVIATE_API_KEY:-wiser-local-weaviate-89455c5a}
      DATA_OPENSEARCH_URL: https://node-0.example.com:9200
      DATA_OPENSEARCH_USERNAME: admin
      DATA_OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-WiserLocalOpenSearch-4f83c21d}
      DATA_NEO4J_URL: http://neo4j:7474
      DATA_NEO4J_DATABASE: neo4j
      DATA_NEO4J_USERNAME: neo4j
      DATA_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-WiserLocalNeo4j-5d6f13b9}
      DATA_STAC_API_URL: http://stac-api:8080
      DATA_STAC_API_BEARER_TOKEN: ${STAC_API_BEARER_TOKEN:-wiser-local-stac-bearer-2cc4d01f}
      DATA_PUBLIC_API_ORIGIN: http://127.0.0.1:3001
      DATA_FAKE_EMBEDDING_DIMENSIONS: '32'
      NODE_EXTRA_CA_CERTS: /etc/wiser/opensearch/root-ca.pem
      AGENT_EXCON_PARTICIPANT_TOKEN: ${AGENT_EXCON_PARTICIPANT_TOKEN:-local-demo-participant-token}
      AGENT_EXCON_OPERATOR_TOKEN: ${AGENT_EXCON_OPERATOR_TOKEN:-local-demo-operator-token}
    ports:
      - 127.0.0.1:3001:3001
    networks:
      - excon
      - data-foundation
    volumes:
      - type: volume
        source: opensearch-ca
        target: /etc/wiser/opensearch
        read_only: true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    <<: *app
    command: pnpm --filter @wiser/web exec next dev --hostname 0.0.0.0 --port 3000
    environment:
      AGENT_EXCON_API_INTERNAL_URL: http://api:3001
      AGENT_EXCON_WEB_DATA_MODE: ${AGENT_EXCON_WEB_DATA_MODE:-live}
      WISER_WEB_OPERATOR_TOKEN: ${WISER_WEB_OPERATOR_TOKEN:-local-demo-operator-token}
      WISER_AUTH_MODE: ${WISER_AUTH_MODE:-off}
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:56321}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://127.0.0.1:56321}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
      WISER_DATA_API_INTERNAL_URL: http://api:3001
      WISER_DATA_TENANT_ID: ${DATA_TENANT_ID:-b1000000-0000-4000-8000-000000000001}
      WISER_DATA_PROJECT_ID: ${DATA_PROJECT_ID:-b2000000-0000-4000-8000-000000000001}
      WISER_DATA_PURPOSE: data-steward-console
      WISER_DATA_REQUEST_TIMEOUT_MS: '8000'
      WISER_DATA_RESPONSE_LIMIT_BYTES: '4194304'
    ports:
      - 127.0.0.1:3000:3000
    networks:
      - excon
      - data-foundation
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/zh-CN').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  worker:
    <<: *app
    command: pnpm --filter @agent-excon/worker dev
    environment:
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:56322/postgres
      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: 8081
      WORKER_ID: compose-worker-1
    ports:
      - 127.0.0.1:3002:8081
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8081/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  docs:
    <<: *app
    command: pnpm --filter @wiser/docs exec next dev --hostname 0.0.0.0 --port 4321
    ports:
      - 127.0.0.1:4321:4321
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4321/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  data-postgres:
    <<: *data-service
    profiles: [data-foundation]
    image: postgis/postgis:18-3.6@sha256:db8c151a4e1f4686b1a985a3490cf96f9f8c8c2725f58a46ef7a57e52f167cc3
    platform: linux/amd64
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_DB: wiser_data
      POSTGRES_USER: wiser_data
      POSTGRES_PASSWORD: ${DATA_POSTGRES_PASSWORD:-wiser-local-data-4f8c71b0f3e947d4}
    ports:
      - 127.0.0.1:55432:5432
    volumes:
      - type: volume
        source: data-postgres-data
        target: /var/lib/postgresql
    healthcheck:
      test:
        [
          CMD-SHELL,
          'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.10'
          memory: 256M
    logging: *data-logging

  data-migrate:
    <<: *app
    profiles: [data-foundation]
    command: pnpm --filter @wiser/data-infra migrate
    restart: 'no'
    environment:
      DATA_DATABASE_MIGRATION_URL: postgresql://wiser_data:${DATA_POSTGRES_PASSWORD:-wiser-local-data-4f8c71b0f3e947d4}@data-postgres:5432/wiser_data
      # Compatibility for the current migration binary; removed after callers
      # have moved to DATA_DATABASE_MIGRATION_URL.
      DATA_POSTGRES_URL: postgresql://wiser_data:${DATA_POSTGRES_PASSWORD:-wiser-local-data-4f8c71b0f3e947d4}@data-postgres:5432/wiser_data
    volumes:
      - ./infrastructure/data-foundation/postgres/migrations:/workspace/infrastructure/data-foundation/postgres/migrations:ro
    depends_on:
      data-postgres:
        condition: service_healthy
    networks:
      - data-foundation

  data-runtime-provision:
    <<: *data-service
    profiles: [data-foundation]
    image: postgis/postgis:18-3.6@sha256:db8c151a4e1f4686b1a985a3490cf96f9f8c8c2725f58a46ef7a57e52f167cc3
    platform: linux/amd64
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        test "$${#DATA_API_DATABASE_PASSWORD}" -ge 16
        test "$${#DATA_WORKER_DATABASE_PASSWORD}" -ge 16
        exec psql -X -v ON_ERROR_STOP=1 \
          --username "$${PGUSER}" --dbname "$${PGDATABASE}" \
          --set=api_password="$${DATA_API_DATABASE_PASSWORD}" \
          --set=worker_password="$${DATA_WORKER_DATABASE_PASSWORD}" \
          --file=/opt/wiser/provision-runtime.sql
    restart: 'no'
    environment:
      PGHOST: data-postgres
      PGPORT: '5432'
      PGDATABASE: wiser_data
      PGUSER: wiser_data
      PGPASSWORD: ${DATA_POSTGRES_PASSWORD:-wiser-local-data-4f8c71b0f3e947d4}
      DATA_API_DATABASE_PASSWORD: ${DATA_API_DATABASE_PASSWORD:-wiser-local-api-runtime-8ac431d9}
      DATA_WORKER_DATABASE_PASSWORD: ${DATA_WORKER_DATABASE_PASSWORD:-wiser-local-worker-runtime-35b90c72}
    volumes:
      - ./infrastructure/data-foundation/postgres/provision-runtime.sql:/opt/wiser/provision-runtime.sql:ro
    depends_on:
      data-migrate:
        condition: service_completed_successfully
    deploy:
      resources: *data-resources
    logging: *data-logging

  pgstac-migrate:
    <<: *data-service
    profiles: [data-foundation]
    image: ghcr.io/stac-utils/pgstac-pypgstac:v0.9.12@sha256:672faad776b55afe15fadb27589c390c4fc93de5bc73e8889d2c29a600c5dba4
    command: [pypgstac, migrate]
    restart: 'no'
    environment:
      PGHOST: data-postgres
      PGPORT: '5432'
      PGDATABASE: wiser_data
      PGUSER: wiser_data
      PGPASSWORD: ${DATA_POSTGRES_PASSWORD:-wiser-local-data-4f8c71b0f3e947d4}
    depends_on:
      data-postgres:
        condition: service_healthy
    deploy:
      resources: *data-resources
    logging: *data-logging

  seaweedfs:
    <<: *data-service
    profiles: [data-foundation]
    image: chrislusf/seaweedfs:4.43@sha256:7bea581f48155c069d3c725e60c386c88210c67cde8bce412344ff6ebea264da
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        umask 027
        printf '{"identities":[{"name":"wiser-data","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write"]}]}\n' "$${SEAWEEDFS_ACCESS_KEY}" "$${SEAWEEDFS_SECRET_KEY}" >/tmp/seaweed-s3.json
        chown seaweed:seaweed /tmp/seaweed-s3.json
        exec /entrypoint.sh server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/seaweed-s3.json -master.telemetry=false
    environment:
      SEAWEEDFS_ACCESS_KEY: ${DATA_S3_ACCESS_KEY_ID:-wiser-data-local-access}
      SEAWEEDFS_SECRET_KEY: ${DATA_S3_SECRET_ACCESS_KEY:-wiser-local-s3-8c492a72f6d84e2e}
    ports:
      - 127.0.0.1:18333:8333
    volumes:
      - type: volume
        source: seaweedfs-data
        target: /data
    healthcheck:
      test:
        [
          CMD-SHELL,
          'curl -fsS http://127.0.0.1:9333/cluster/status >/dev/null && curl -sS -o /dev/null http://127.0.0.1:8333/',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources: *data-resources
    logging: *data-logging

  data-object-store-init:
    <<: *app
    profiles: [data-foundation]
    command: pnpm --filter @wiser/data-infra init-object-store
    restart: 'no'
    environment:
      DATA_S3_ENDPOINT: http://seaweedfs:8333
      DATA_S3_REGION: ${DATA_S3_REGION:-us-east-1}
      DATA_S3_BUCKET: ${DATA_S3_BUCKET:-wiser-authority}
      DATA_S3_ACCESS_KEY_ID: ${DATA_S3_ACCESS_KEY_ID:-wiser-data-local-access}
      DATA_S3_SECRET_ACCESS_KEY: ${DATA_S3_SECRET_ACCESS_KEY:-wiser-local-s3-8c492a72f6d84e2e}
    depends_on:
      seaweedfs:
        condition: service_healthy
    networks:
      - data-foundation
    deploy:
      resources: *data-resources
    logging: *data-logging

  weaviate:
    <<: *data-service
    profiles: [data-foundation]
    image: cr.weaviate.io/semitechnologies/weaviate:1.39.0@sha256:7660940e14fabb70429d6cd625600147aef8ed8aa576525baa22b4f00a4556b2
    environment:
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'false'
      AUTHENTICATION_APIKEY_ENABLED: 'true'
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY:-wiser-local-weaviate-89455c5a}
      AUTHENTICATION_APIKEY_USERS: wiser-data
      AUTHORIZATION_ENABLE_RBAC: 'true'
      AUTHORIZATION_RBAC_ROOT_USERS: wiser-data
      CLUSTER_HOSTNAME: wiser-data-node-1
      DISABLE_TELEMETRY: 'true'
      LIMIT_RESOURCES: 'true'
    ports:
      - 127.0.0.1:18080:8080
    volumes:
      - type: volume
        source: weaviate-data
        target: /var/lib/weaviate
    healthcheck:
      test:
        [
          CMD-SHELL,
          'wget -q --spider http://127.0.0.1:8080/v1/.well-known/ready',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources: *data-resources
    logging: *data-logging

  opensearch-icu-init:
    <<: *data-service
    profiles: [data-foundation]
    image: opensearchproject/opensearch:3.8.0@sha256:bcc1797519726ceb6d651d4a3e60b7c30da91793914a8dfe75fd441d4f641509
    user: '0'
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        readonly checksum=3615266c495175f38dfabebe30d2fa9f5aa1ecdbd5800737ffa787bb3c2a1e78828ce48eb4ef1e713c5273ae1f8738dc4bf8d9b51c6840103bdc1dba08b61b8e
        if ! test -s /usr/share/opensearch/config/root-ca.pem; then
          /usr/share/opensearch/plugins/opensearch-security/tools/install_demo_configuration.sh -y >/dev/null || test -s /usr/share/opensearch/config/root-ca.pem
        fi
        install -m 0444 /usr/share/opensearch/config/root-ca.pem /ca-out/root-ca.pem
        if test -f /plugin-out/.wiser-sha512; then
          grep -qx "$${checksum}" /plugin-out/.wiser-sha512
          test -f /plugin-out/plugin-descriptor.properties
          exit 0
        fi
        shopt -s dotglob nullglob
        existing=(/plugin-out/*)
        test "$${#existing[@]}" -eq 0
        curl -fsSLo /tmp/analysis-icu.zip https://artifacts.opensearch.org/releases/plugins/analysis-icu/3.8.0/analysis-icu-3.8.0.zip
        printf '%s  %s\n' "$${checksum}" /tmp/analysis-icu.zip | sha512sum -c -
        /usr/share/opensearch/bin/opensearch-plugin install --batch file:///tmp/analysis-icu.zip
        cp -a /usr/share/opensearch/plugins/analysis-icu/. /plugin-out/
        printf '%s\n' "$${checksum}" >/plugin-out/.wiser-sha512
    restart: 'no'
    environment:
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD:-WiserLocalOpenSearch-4f83c21d}
    volumes:
      - type: volume
        source: opensearch-icu-plugin
        target: /plugin-out
      - type: volume
        source: opensearch-ca
        target: /ca-out
    deploy:
      resources: *data-resources
    logging: *data-logging

  opensearch:
    <<: *data-service
    profiles: [data-foundation]
    image: opensearchproject/opensearch:3.8.0@sha256:bcc1797519726ceb6d651d4a3e60b7c30da91793914a8dfe75fd441d4f641509
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD:-WiserLocalOpenSearch-4f83c21d}
      DISABLE_INSTALL_DEMO_CONFIG: 'false'
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - 127.0.0.1:19200:9200
    networks:
      data-foundation:
        aliases:
          - node-0.example.com
    volumes:
      - type: volume
        source: opensearch-data
        target: /usr/share/opensearch/data
      - type: volume
        source: opensearch-icu-plugin
        target: /usr/share/opensearch/plugins/analysis-icu
        read_only: true
    depends_on:
      opensearch-icu-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD-SHELL,
          'curl -kfsS -u "admin:$${OPENSEARCH_INITIAL_ADMIN_PASSWORD}" "https://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null && curl -kfsS -u "admin:$${OPENSEARCH_INITIAL_ADMIN_PASSWORD}" "https://127.0.0.1:9200/_cat/plugins?h=component" | grep -qx analysis-icu',
        ]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 768M
    logging: *data-logging

  opensearch-dashboards:
    <<: *data-service
    profiles: [data-foundation]
    image: opensearchproject/opensearch-dashboards:3.8.0@sha256:ca28e40a095f7f03c5c02b4aa159fbf09638bc4b3af16f9d556bf6721a0783b1
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
      OPENSEARCH_USERNAME: admin
      OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-WiserLocalOpenSearch-4f83c21d}
    ports:
      - 127.0.0.1:15601:5601
    volumes:
      - type: volume
        source: opensearch-dashboards-data
        target: /usr/share/opensearch-dashboards/data
    depends_on:
      opensearch:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD-SHELL,
          'curl -fsS -u "admin:$${OPENSEARCH_PASSWORD}" http://127.0.0.1:5601/api/status >/dev/null',
        ]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 30s
    deploy:
      resources: *data-resources
    logging: *data-logging

  neo4j:
    <<: *data-service
    profiles: [data-foundation]
    image: neo4j:2026.07.1@sha256:0ddfa71c8f0bfe0d780d74fb66b985de4767bbd274bab70c0806cb3a6deec101
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-WiserLocalNeo4j-5d6f13b9}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - 127.0.0.1:17474:7474
    volumes:
      - type: volume
        source: neo4j-data
        target: /data
    healthcheck:
      test:
        [
          CMD-SHELL,
          'cypher-shell -a bolt://127.0.0.1:7687 -u neo4j -p "$${NEO4J_AUTH#neo4j/}" "RETURN 1;" >/dev/null',
        ]
      interval: 10s
      timeout: 10s
      retries: 40
      start_period: 30s
    deploy:
      resources: *data-resources
    logging: *data-logging

  geoserver:
    <<: *data-service
    profiles: [data-foundation]
    image: docker.osgeo.org/geoserver:3.0.1@sha256:7cb827ba3f6d9fc04a6647fc0cfa6c254fc642407f0d99281fdf026d2540b558
    platform: linux/amd64
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_USERNAME:-wiser-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_PASSWORD:-WiserLocalGeoServer-53d7c91e}
      HEALTHCHECK_URL: http://127.0.0.1:8080/geoserver/web/
      EXTRA_JAVA_OPTS: -Xms256m -Xmx1g
      RUN_UNPRIVILEGED: 'true'
    ports:
      - 127.0.0.1:18081:8080
    volumes:
      - type: volume
        source: geoserver-data
        target: /opt/geoserver_data
    healthcheck:
      test:
        [CMD-SHELL, 'curl -fsS http://127.0.0.1:8080/geoserver/web/ >/dev/null']
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 45s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.10'
          memory: 512M
    logging: *data-logging

  stac-api:
    <<: *data-service
    profiles: [data-foundation]
    image: ghcr.io/stac-utils/stac-fastapi-pgstac:6.3.1@sha256:db117b91302f7983ce4e07658768a6e8d2f6716613252a15f5dcdbda8dae9883
    environment:
      PGHOST: data-postgres
      PGPORT: '5432'
      PGDATABASE: wiser_data
      PGUSER: wiser_data
      PGPASSWORD: ${DATA_POSTGRES_PASSWORD:-wiser-local-data-4f8c71b0f3e947d4}
      DB_MIN_CONN_SIZE: '1'
      DB_MAX_CONN_SIZE: '5'
      ENABLE_TRANSACTIONS_EXTENSIONS: 'true'
    ports:
      - 127.0.0.1:18082:8080
    depends_on:
      data-migrate:
        condition: service_completed_successfully
      pgstac-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/_mgmt/health', timeout=5).read()",
        ]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 15s
    deploy:
      resources: *data-resources
    logging: *data-logging

  titiler:
    <<: *data-service
    profiles: [data-foundation]
    image: ghcr.io/developmentseed/titiler:2.2.1@sha256:bf753ccf0fe0f231bc51a0ddbaebf7c0c82253a26db8ab25d1c30ea417e704ff
    environment:
      AWS_ACCESS_KEY_ID: ${DATA_S3_ACCESS_KEY_ID:-wiser-data-local-access}
      AWS_SECRET_ACCESS_KEY: ${DATA_S3_SECRET_ACCESS_KEY:-wiser-local-s3-8c492a72f6d84e2e}
      AWS_REGION: ${DATA_S3_REGION:-us-east-1}
      AWS_S3_ENDPOINT: seaweedfs:8333
      AWS_HTTPS: 'NO'
      AWS_VIRTUAL_HOSTING: 'FALSE'
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      WEB_CONCURRENCY: '1'
    ports:
      - 127.0.0.1:18000:80
    depends_on:
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:80/healthz >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s
    deploy:
      resources: *data-resources
    logging: *data-logging

  martin:
    <<: *data-service
    profiles: [data-foundation]
    image: ghcr.io/maplibre/martin:1.14.0@sha256:fe5e8952312ca8ea0a25c4b1f72ceb13676f2b50dca310843e48b31c8ceb2264
    environment:
      DATABASE_URL: postgresql://wiser_data:${DATA_POSTGRES_PASSWORD:-wiser-local-data-4f8c71b0f3e947d4}@data-postgres:5432/wiser_data
    ports:
      - 127.0.0.1:13000:3000
    depends_on:
      data-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s
    deploy:
      resources: *data-resources
    logging: *data-logging

  tika:
    <<: *data-service
    profiles: [data-foundation]
    image: apache/tika:3.3.1.0-full@sha256:d8e6ed96260ad89307a93195a1b856102987a818ac648502f8efbaf313d32470
    environment:
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx1g
    ports:
      - 127.0.0.1:19998:9998
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider http://127.0.0.1:9998/tika']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources: *data-resources
    logging: *data-logging

  clamav:
    <<: *data-service
    profiles: [data-foundation]
    image: clamav/clamav:1.5.4-debian13-slim@sha256:2bb8cd7dfe3e87f86e969a2c415f7698583175e46dc2234672be9210c982c144
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    ports:
      - 127.0.0.1:13310:3310
    volumes:
      - type: volume
        source: clamav-data
        target: /var/lib/clamav
    healthcheck:
      test: [CMD-SHELL, clamdcheck.sh]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 5m
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.10'
          memory: 1G
    logging: *data-logging

  data-worker:
    <<: *app
    profiles: [data-foundation]
    command: pnpm --filter @wiser/data-worker dev
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      DATA_DATABASE_URL: postgresql://wiser_data_worker:${DATA_WORKER_DATABASE_PASSWORD:-wiser-local-worker-runtime-35b90c72}@data-postgres:5432/wiser_data
      DATA_TENANT_ID: ${DATA_TENANT_ID:-b1000000-0000-4000-8000-000000000001}
      DATA_PROJECT_ID: ${DATA_PROJECT_ID:-b2000000-0000-4000-8000-000000000001}
      DATA_MAX_SECURITY_LEVEL: ${DATA_MAX_SECURITY_LEVEL:-L3_CONFIDENTIAL}
      DATA_POLICY_VERSION: ${DATA_POLICY_VERSION:-1}
      DATA_WORKER_ID: ${DATA_WORKER_ID:-compose-data-worker-1}
      DATA_WORKER_ACTOR_ID: ${DATA_WORKER_ACTOR_ID:-b6000000-0000-4000-8000-000000000001}
      DATA_WORKER_CLAIM_LIMIT: ${DATA_WORKER_CLAIM_LIMIT:-8}
      DATA_WORKER_HEALTH_HOST: 0.0.0.0
      DATA_WORKER_HEALTH_PORT: '3003'
      DATA_JOB_LEASE_SECONDS: ${DATA_JOB_LEASE_SECONDS:-120}
      DATA_JOB_HEARTBEAT_SECONDS: ${DATA_JOB_HEARTBEAT_SECONDS:-30}
      DATA_JOB_POLL_INTERVAL_MS: ${DATA_JOB_POLL_INTERVAL_MS:-1000}
      DATA_S3_ENDPOINT: http://seaweedfs:8333
      DATA_S3_REGION: ${DATA_S3_REGION:-us-east-1}
      DATA_S3_BUCKET: ${DATA_S3_BUCKET:-wiser-authority}
      DATA_S3_ACCESS_KEY_ID: ${DATA_S3_ACCESS_KEY_ID:-wiser-data-local-access}
      DATA_S3_SECRET_ACCESS_KEY: ${DATA_S3_SECRET_ACCESS_KEY:-wiser-local-s3-8c492a72f6d84e2e}
      DATA_INGESTION_MAX_OBJECT_BYTES: '16777216'
      DATA_INGESTION_MIN_QUALITY_SCORE: '0.75'
      DATA_INGESTION_MIN_AI_CONFIDENCE: '0.8'
      DATA_CLAMAV_HOST: clamav
      DATA_CLAMAV_PORT: '3310'
      DATA_CLAMAV_TIMEOUT_MS: '30000'
      DATA_CLAMAV_MAX_RESPONSE_BYTES: '4096'
      DATA_TIKA_ENDPOINT: http://tika:9998
      DATA_TIKA_TIMEOUT_MS: '30000'
      DATA_TIKA_MAX_RESPONSE_BYTES: '1048576'
      DATA_WEAVIATE_URL: http://weaviate:8080
      DATA_WEAVIATE_API_KEY: ${WEAVIATE_API_KEY:-wiser-local-weaviate-89455c5a}
      DATA_OPENSEARCH_URL: https://node-0.example.com:9200
      DATA_OPENSEARCH_USERNAME: admin
      DATA_OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-WiserLocalOpenSearch-4f83c21d}
      DATA_NEO4J_URL: http://neo4j:7474
      DATA_NEO4J_DATABASE: neo4j
      DATA_NEO4J_USERNAME: neo4j
      DATA_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-WiserLocalNeo4j-5d6f13b9}
      DATA_STAC_API_URL: http://stac-api:8080
      DATA_STAC_BEARER_TOKEN: ${STAC_API_BEARER_TOKEN:-wiser-local-stac-bearer-2cc4d01f}
      DATA_STAC_ASSET_BASE_URL: http://127.0.0.1:3001
      DATA_PROJECTION_CONSUMER_NAME: data-worker-projection-v1
      DATA_PROJECTION_BATCH_LIMIT: '8'
      DATA_PROJECTION_POLL_INTERVAL_MS: '1000'
      DATA_PROJECTION_HTTP_TIMEOUT_MS: '30000'
      DATA_PROJECTION_HTTP_MAX_RESPONSE_BYTES: '1048576'
      DATA_PROJECTION_CACHE_EVENTS: '32'
      DATA_FAKE_EMBEDDING_DIMENSIONS: '32'
      DATA_FAKE_EMBEDDING_VERSION: 1.0.0-fixture
      DATA_PUBLICATION_WAIT_TIMEOUT_MS: '90000'
      DATA_PUBLICATION_WAIT_POLL_MS: '250'
      NODE_EXTRA_CA_CERTS: /etc/wiser/opensearch/root-ca.pem
    ports:
      - 127.0.0.1:13003:3003
    depends_on:
      data-runtime-provision:
        condition: service_completed_successfully
      data-object-store-init:
        condition: service_completed_successfully
      opensearch:
        condition: service_healthy
    networks:
      - data-foundation
    volumes:
      - type: volume
        source: opensearch-ca
        target: /etc/wiser/opensearch
        read_only: true
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3003/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s
    deploy:
      resources: *data-resources
    logging: *data-logging

  mcp-http:
    <<: *app
    profiles: [data-foundation]
    command: pnpm --filter @wiser/mcp dev:http
    restart: unless-stopped
    environment:
      DATA_MCP_TRANSPORT: streamable-http
      DATA_MCP_BEARER_TOKEN: ${DATA_MCP_BEARER_TOKEN:-wiser-local-mcp-bearer-74cc91ef}
      DATA_MCP_HOST: 0.0.0.0
      DATA_MCP_PORT: '3004'
      DATA_API_URL: http://api:3001/api/data/v1/
      DATA_API_BEARER_TOKEN: ${DATA_API_BEARER_TOKEN:-}
      DATA_TENANT_ID: ${DATA_TENANT_ID:-b1000000-0000-4000-8000-000000000001}
      DATA_PROJECT_ID: ${DATA_PROJECT_ID:-b2000000-0000-4000-8000-000000000001}
      DATA_PURPOSE: data-foundation-smoke
      AGENT_EXCON_API_URL: http://api:3001/api/v2
      AGENT_EXCON_API_KEY: ${AGENT_EXCON_PARTICIPANT_TOKEN:-local-demo-participant-token}
      AGENT_EXCON_PROTOCOL_VERSION: v2
    ports:
      - 127.0.0.1:13004:3004
    depends_on:
      api:
        condition: service_healthy
    networks:
      - data-foundation
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3004/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    deploy:
      resources: *data-resources
    logging: *data-logging

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0@sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc
    profiles: [observability]
    command: [--config=/etc/otelcol-contrib/config.yaml]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./infrastructure/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - 127.0.0.1:4317:4317
      - 127.0.0.1:4318:4318
      - 127.0.0.1:13133:13133
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - excon

  telemetry-ingress:
    <<: *app
    profiles: [observability]
    command: pnpm --filter @wiser/telemetry-ingress dev
    environment:
      TELEMETRY_INGRESS_HOST: 0.0.0.0
      TELEMETRY_INGRESS_PORT: 3003
      OTEL_COLLECTOR_INTERNAL_URL: http://otel-collector:4318
      WISER_TELEMETRY_LOCAL_TOKEN: ${WISER_TELEMETRY_LOCAL_TOKEN:-local-participant-telemetry-token-0001}
      WISER_TELEMETRY_LOCAL_RUN_ID: 51000000-0000-4000-8000-000000000001
      WISER_TELEMETRY_LOCAL_RUN_AGENT_ID: 53000000-0000-4000-8000-000000000001
      WISER_TELEMETRY_LOCAL_ROLE: water-evidence
    ports:
      - 127.0.0.1:14318:3003
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3003/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  tempo:
    image: grafana/tempo:3.0.3@sha256:0296560ac66f8a3600d7fb3014a52c189d4d9c3549ad6ff441bf2409855d68d5
    profiles: [observability]
    command: [-target=all, -config.file=/etc/tempo.yaml]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./infrastructure/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - excon

  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --web.enable-remote-write-receiver
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./infrastructure/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - 127.0.0.1:9090:9090
    networks:
      - excon

  loki:
    image: grafana/loki:3.7.6@sha256:efd47c67f9bac88ca29bcf8cb997d9ab29d1848bd0aff579282295542a745952
    profiles: [observability]
    command: [-config.file=/etc/loki/loki.yaml]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./infrastructure/observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks:
      - excon

  grafana:
    image: grafana/grafana:13.2.0@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b
    profiles: [observability]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      GF_SECURITY_ADMIN_USER: ${WISER_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${WISER_GRAFANA_ADMIN_PASSWORD:-local-observability-only}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - ./infrastructure/observability/grafana/provisioning/datasources/wiser.yaml:/etc/grafana/provisioning/datasources/wiser.yaml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - 127.0.0.1:3300:3000
    depends_on:
      tempo:
        condition: service_started
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - excon

networks:
  data-foundation:
    driver: bridge
  excon:
    driver: bridge

volumes:
  clamav-data:
  data-postgres-data:
  geoserver-data:
  grafana-data:
  loki-data:
  neo4j-data:
  opensearch-data:
  opensearch-dashboards-data:
  opensearch-ca:
  opensearch-icu-plugin:
  prometheus-data:
  seaweedfs-data:
  tempo-data:
  weaviate-data:
