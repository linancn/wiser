name: wiser

x-app: &app
  image: agent-excon-dev:local
  build:
    context: .
    dockerfile: infrastructure/docker/Dockerfile.dev
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  extra_hosts:
    - host.docker.internal:host-gateway
  networks:
    - excon

services:
  api:
    <<: *app
    command: pnpm --filter @agent-excon/api dev
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3001
      AI_PROVIDER: fake
      AGENT_EXCON_PARTICIPANT_TOKEN: ${AGENT_EXCON_PARTICIPANT_TOKEN:-local-demo-participant-token}
      AGENT_EXCON_OPERATOR_TOKEN: ${AGENT_EXCON_OPERATOR_TOKEN:-local-demo-operator-token}
    ports:
      - 127.0.0.1:3001:3001
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  web:
    <<: *app
    command: pnpm --filter @agent-excon/web exec next dev --hostname 0.0.0.0 --port 3000
    environment:
      AGENT_EXCON_API_INTERNAL_URL: http://api:3001
      AGENT_EXCON_WEB_DATA_MODE: ${AGENT_EXCON_WEB_DATA_MODE:-live}
      WISER_WEB_OPERATOR_TOKEN: ${WISER_WEB_OPERATOR_TOKEN:-local-demo-operator-token}
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/zh-CN').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  worker:
    <<: *app
    command: pnpm --filter @agent-excon/worker dev
    environment:
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:56322/postgres
      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: 8081
      WORKER_ID: compose-worker-1
    ports:
      - 127.0.0.1:3002:8081
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8081/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  docs:
    <<: *app
    command: pnpm --filter @agent-excon/docs exec next dev --hostname 0.0.0.0 --port 4321
    ports:
      - 127.0.0.1:4321:4321
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4321/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0@sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc
    profiles: [observability]
    command: [--config=/etc/otelcol-contrib/config.yaml]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./infrastructure/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - 127.0.0.1:4317:4317
      - 127.0.0.1:4318:4318
      - 127.0.0.1:13133:13133
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - excon

  telemetry-ingress:
    <<: *app
    profiles: [observability]
    command: pnpm --filter @agent-excon/telemetry-ingress dev
    environment:
      TELEMETRY_INGRESS_HOST: 0.0.0.0
      TELEMETRY_INGRESS_PORT: 3003
      OTEL_COLLECTOR_INTERNAL_URL: http://otel-collector:4318
      WISER_TELEMETRY_LOCAL_TOKEN: ${WISER_TELEMETRY_LOCAL_TOKEN:-local-participant-telemetry-token-0001}
      WISER_TELEMETRY_LOCAL_RUN_ID: 51000000-0000-4000-8000-000000000001
      WISER_TELEMETRY_LOCAL_RUN_AGENT_ID: 53000000-0000-4000-8000-000000000001
      WISER_TELEMETRY_LOCAL_ROLE: water-evidence
    ports:
      - 127.0.0.1:14318:3003
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3003/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  tempo:
    image: grafana/tempo:3.0.3@sha256:0296560ac66f8a3600d7fb3014a52c189d4d9c3549ad6ff441bf2409855d68d5
    profiles: [observability]
    command: [-target=all, -config.file=/etc/tempo.yaml]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./infrastructure/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - excon

  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --web.enable-remote-write-receiver
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./infrastructure/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - 127.0.0.1:9090:9090
    networks:
      - excon

  loki:
    image: grafana/loki:3.7.6@sha256:efd47c67f9bac88ca29bcf8cb997d9ab29d1848bd0aff579282295542a745952
    profiles: [observability]
    command: [-config.file=/etc/loki/loki.yaml]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./infrastructure/observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks:
      - excon

  grafana:
    image: grafana/grafana:13.2.0@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b
    profiles: [observability]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      GF_SECURITY_ADMIN_USER: ${WISER_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${WISER_GRAFANA_ADMIN_PASSWORD:-local-observability-only}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - ./infrastructure/observability/grafana/provisioning/datasources/wiser.yaml:/etc/grafana/provisioning/datasources/wiser.yaml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - 127.0.0.1:3300:3000
    depends_on:
      tempo:
        condition: service_started
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - excon

networks:
  excon:
    driver: bridge

volumes:
  grafana-data:
  loki-data:
  prometheus-data:
  tempo-data:
