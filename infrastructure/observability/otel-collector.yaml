extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  attributes/drop_sensitive_content:
    actions:
      - pattern: '^(gen_ai\.(input|output|prompt|completion)|tool\.(arguments|result)|wiser\.(content|submission|feedback|hidden)\.(body|payload|outcome))'
        action: delete
  resource/drop_sensitive_content:
    attributes:
      - pattern: '^(gen_ai\.(input|output|prompt|completion)|tool\.(arguments|result)|wiser\.(content|submission|feedback|hidden)\.(body|payload|outcome))'
        action: delete
  batch:
    send_batch_size: 1024
    timeout: 2s

exporters:
  otlp_http/tempo:
    endpoint: http://tempo:4318
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  otlp_http/loki:
    endpoint: http://loki:3100/otlp

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors:
        [
          memory_limiter,
          attributes/drop_sensitive_content,
          resource/drop_sensitive_content,
          batch,
        ]
      exporters: [otlp_http/tempo]
    metrics:
      receivers: [otlp]
      processors:
        [
          memory_limiter,
          attributes/drop_sensitive_content,
          resource/drop_sensitive_content,
          batch,
        ]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors:
        [
          memory_limiter,
          attributes/drop_sensitive_content,
          resource/drop_sensitive_content,
          batch,
        ]
      exporters: [otlp_http/loki]
