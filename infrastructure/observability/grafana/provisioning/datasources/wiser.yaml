apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Tempo
    orgId: 1
  - name: Loki
    orgId: 1

datasources:
  - name: Prometheus
    uid: wiser-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: wiser-tempo

  - name: Loki
    uid: wiser-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '(?:trace_id|traceId)[=:]"?([0-9a-fA-F]{32})'
          datasourceUid: wiser-tempo
          url: '${__value.raw}'

  - name: Tempo
    uid: wiser-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      httpMethod: GET
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: wiser-prometheus
      tracesToLogsV2:
        datasourceUid: wiser-loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: true
        filterBySpanID: true
      tracesToMetrics:
        datasourceUid: wiser-prometheus
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        tags:
          - key: service.name
            value: service
          - key: wiser.agent.role
            value: agent_role
          - key: wiser.scenario.id
            value: scenario
