global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: wiser-otel-collector
    static_configs:
      - targets: [otel-collector:8889]

  - job_name: wiser-tempo
    metrics_path: /metrics
    static_configs:
      - targets: [tempo:3200]

  - job_name: wiser-loki
    metrics_path: /metrics
    static_configs:
      - targets: [loki:3100]
